[package]
name = "cmd-down"
version = "0.1.0"
description = "Menu bar tool for left Cmd key hold detection"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
device_query = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
